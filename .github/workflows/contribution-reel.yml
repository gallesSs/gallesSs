name: contribution-reel

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#f0b25e&color_dots=#191d25,#3a2f20,#6b4f2a,#a2601a,#f0b25e&color_dot_border=#0b0d11&color_background=#0b0d11
            dist/snake-light.svg?color_snake=#a2601a&color_dots=#dcd5c6,#d8bf98,#c99a5c,#a2601a,#6e3f0f&color_dot_border=#e9e4d8&color_background=#e9e4d8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
